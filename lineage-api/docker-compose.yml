services:
  lineage-api:
    build: .
    image: lineage-api:latest
    container_name: lineage-api
    ports:
      - "8000:8000"
    environment:
      LINEAGE_DB_PATH: /data/lineage.db
    volumes:
      - lineage-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  lineage-data:
